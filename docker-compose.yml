services:
  postgres:
    image: postgres:16
    container_name: corra-melhor-db
    restart: always
    environment:
      POSTGRES_USER: corra
      POSTGRES_PASSWORD: corra123
      POSTGRES_DB: corramelhor
    ports:
      - "5433:5432"
    volumes:
      - corra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corra -d corramelhor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  corra_pgdata:
